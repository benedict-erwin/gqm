# GQM Dev Server — YAML Config Variant
# Same features as the programmatic variant, but pools/queues/cron/auth defined in YAML.
# Demonstrates multi-queue pools, varied dequeue strategies, and different retry policies.
#
# BEFORE THIS WILL START: generate a password hash and paste it into
# monitoring.auth.users[0].password_hash below.
#
#     gqm hash-password
#
# The committed placeholder is not a valid bcrypt hash, so config validation
# rejects it. That is on purpose — see the comment at the field.

redis:
    addr: GQM_TEST_REDIS_ADDR
    db: 0
app:
    timezone: UTC
    log_level: debug
    global_job_timeout: 1800 # 30 minutes
    grace_period: 10
    shutdown_timeout: 30
queues:
    - name: email:send
    - name: report:generate
    - name: notification:push
    - name: image:resize
    - name: data:export
    - name: invoice:generate
    - name: payment:process
    - name: shipping:schedule
    - name: analytics:aggregate
pools:
    # Comms pool — high concurrency, strict priority (notification > email).
    # strict means email:send waits until notification:push is empty; a busy
    # notification queue starves it. Shown here to contrast with the pools
    # below — weighted (the default) keeps every queue moving.
    - name: comms-pool
      job_types: ["email:send", "notification:push"]
      queues: ["notification:push", "email:send"]
      concurrency: 5
      dequeue_strategy: "strict"
      retry:
        max_retry: 3
        backoff: exponential
        backoff_base: 2
        backoff_max: 60
    # Report pool — slow jobs, round-robin across queues
    - name: report-pool
      job_types: ["report:generate"]
      queues: ["report:generate"]
      concurrency: 2
      job_timeout: 300
      dequeue_strategy: "round_robin"
      retry:
        max_retry: 3
        backoff: fixed
        backoff_base: 10
    # Image pool — always fails, quick retry for fast DLQ demo
    - name: image-pool
      job_types: ["image:resize"]
      queues: ["image:resize"]
      concurrency: 2
      retry:
        max_retry: 1
        backoff: fixed
        backoff_base: 2
    # Export pool — high failure rate, aggressive retry
    - name: export-pool
      job_types: ["data:export"]
      queues: ["data:export"]
      concurrency: 2
      dequeue_strategy: "weighted"
      retry:
        max_retry: 5
        backoff: exponential
        backoff_base: 3
        backoff_max: 120
    # Billing pool — MULTI-QUEUE: payment + invoice in one pool, weighted strategy
    - name: billing-pool
      job_types: ["payment:process", "invoice:generate"]
      queues: ["payment:process", "invoice:generate"]
      concurrency: 3
      dequeue_strategy: "weighted"
      retry:
        max_retry: 3
        backoff: exponential
        backoff_base: 5
        backoff_max: 60
    # Logistics pool — shipping only, no retry (fire-and-forget style)
    - name: logistics-pool
      job_types: ["shipping:schedule"]
      queues: ["shipping:schedule"]
      concurrency: 1
    # Analytics pool — low priority background work
    - name: analytics-pool
      job_types: ["analytics:aggregate"]
      queues: ["analytics:aggregate"]
      concurrency: 1
      retry:
        max_retry: 2
        backoff: fixed
        backoff_base: 30
scheduler:
    poll_interval: 5
    cron_entries:
        - id: daily-report
          name: "Daily Summary Report"
          cron_expr: "0 8 * * *"
          job_type: report:generate
          queue: report:generate
          max_retry: 3
          enabled: true
        - id: hourly-cleanup
          name: "Hourly Cleanup"
          cron_expr: "0 * * * *"
          job_type: data:export
          queue: data:export
          max_retry: 1
          enabled: true
        - id: weekly-digest
          name: "Weekly Email Digest"
          cron_expr: "0 9 * * 1"
          job_type: email:send
          queue: email:send
          max_retry: 5
          enabled: true
        - id: disabled-task
          name: "Disabled Maintenance Task"
          cron_expr: "30 3 * * *"
          job_type: data:export
          queue: data:export
          max_retry: 1
          enabled: false
monitoring:
    dashboard:
        enabled: true
    auth:
        enabled: true
        session_ttl: 86400
        users:
            - username: admin
              # Generate your own before this will start:
              #   gqm hash-password
              # and paste the result here. This placeholder is not a bcrypt
              # hash, so the server refuses to start until you replace it —
              # that is deliberate. A working hash committed here would be a
              # publicly known admin password for anyone who copied this file.
              password_hash: "CHANGE-ME-RUN-gqm-hash-password"
              role: admin
    api:
        enabled: true
        addr: ":8080"
        api_keys:
            - name: dev-key
              key: "gqm_ak_dev_server_config_key_for_testing_only"
              role: admin
