# GQM Config — Example 06: Config-driven Setup
# All pool/queue definitions here. Code only registers handlers.

redis:
  addr: localhost:6379
  db: 0

app:
  timezone: UTC
  log_level: debug
  global_job_timeout: 300    # 5 minutes
  grace_period: 10
  shutdown_timeout: 30

queues:
  - name: email:high
  - name: email:low
  - name: report:generate

pools:
  - name: email-pool
    job_types:
      - "email:send"
      - "email:bulk"
    # Priority is the order of this list — first entry is highest.
    # There is no priority number to assign anywhere.
    queues:
      - "email:high"       # highest — drained first
      - "email:low"        # only read once email:high is empty (see strategy below)
    concurrency: 4
    job_timeout: 30
    # strict is deliberate here, and it has a cost: email:low is only read when
    # email:high is empty, so a busy email:high starves it indefinitely. The
    # default is weighted, which keeps every queue moving. Choose strict only
    # when you truly want the lower queue to wait.
    dequeue_strategy: strict
    retry:
      max_retry: 5
      backoff: exponential
      backoff_base: 2
      backoff_max: 60

  - name: report-pool
    job_types:
      - "report:generate"
    queues:
      - "report:generate"
    concurrency: 2
    job_timeout: 300       # 5 minutes for reports
    retry:
      max_retry: 3
      backoff: fixed
      backoff_base: 30

scheduler:
  poll_interval: 5
  cron_entries:
    - id: temp-cleanup
      name: "Temporary File Cleanup"
      cron_expr: "0 */6 * * *"     # every 6 hours
      job_type: "cleanup:temp"
      queue: "email:low"           # low priority — use email pool
      max_retry: 1
      enabled: true
