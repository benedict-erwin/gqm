services:
  redis:
    image: redis:7-alpine
    # Loopback only. This Redis has no password and the image ships with
    # protected-mode off (bind * -::*), so publishing it as "6379:6379" would
    # bind every interface and hand anyone on the network the session store,
    # every job payload, and FLUSHALL.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
