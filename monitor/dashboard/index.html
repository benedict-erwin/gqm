<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GQM Dashboard</title>
    <script>
    // Apply the persisted theme before first paint to avoid a flash of the
    // wrong theme. Falls back to the OS preference (handled in CSS).
    (function() {
        try {
            var t = localStorage.getItem('gqm-theme');
            if (t === 'dark' || t === 'light') {
                document.documentElement.setAttribute('data-theme', t);
            }
        } catch (e) { /* storage unavailable — OS preference applies */ }
    })();
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="layout">
        <nav id="sidebar">
            <div class="sidebar-header">
                <div class="brand-mark">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#08211c" stroke-width="2" stroke-linecap="round">
                        <path d="M2 4h9M2 8h12M2 12h7"/><circle cx="13.5" cy="4" r="1.4" fill="#08211c" stroke="none"/>
                    </svg>
                </div>
                <div class="brand-title">
                    <span class="logo">GQM</span>
                    <span class="version">Go Queue Manager</span>
                </div>
            </div>

            <div class="nav-group">
                <div class="nav-group-label">Monitor</div>
                <ul class="nav-links">
                    <li><a href="#/" data-page="overview" class="nav-link active"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1"/><rect x="9" y="9" width="5.5" height="5.5" rx="1"/></svg>Overview</a></li>
                    <li><a href="#/servers" data-page="servers" class="nav-link"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2" width="13" height="4.5" rx="1"/><rect x="1.5" y="9.5" width="13" height="4.5" rx="1"/><circle cx="4.2" cy="4.2" r=".9" fill="currentColor" stroke="none"/><circle cx="4.2" cy="11.7" r=".9" fill="currentColor" stroke="none"/></svg>Servers</a></li>
                    <li><a href="#/queues" data-page="queues" class="nav-link"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 3.5h12M2 8h12M2 12.5h8.5"/></svg>Queues<span class="nav-count" id="nav-count-queues"></span></a></li>
                    <li><a href="#/workers" data-page="workers" class="nav-link"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="8" height="8" rx="1.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.5 1.5M13 3l-1.5 1.5M3 13l1.5-1.5M13 13l-1.5-1.5"/></svg>Workers<span class="nav-count" id="nav-count-workers"></span></a></li>
                </ul>
            </div>

            <div class="nav-group">
                <div class="nav-group-label">Operate</div>
                <ul class="nav-links">
                    <li><a href="#/failed" data-page="failed" class="nav-link"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 1.8 15 14H1L8 1.8z" stroke-linejoin="round"/><path d="M8 6.2v3.4"/><circle cx="8" cy="11.8" r=".7" fill="currentColor" stroke="none"/></svg>Failed / DLQ<span class="nav-count" id="nav-count-dlq"></span></a></li>
                    <li><a href="#/scheduler" data-page="scheduler" class="nav-link"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5V8l2.5 1.8"/></svg>Scheduler</a></li>
                    <li><a href="#/dag" data-page="dag" class="nav-link"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="3" r="1.8"/><circle cx="3.5" cy="12.5" r="1.8"/><circle cx="12.5" cy="12.5" r="1.8"/><path d="M7 4.5 4.3 11M9 4.5l2.7 6.5"/></svg>DAG</a></li>
                </ul>
            </div>

            <div class="sidebar-spacer"></div>
            <div class="sidebar-footer">
                <span id="auth-user"></span>
                <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></svg>
                </button>
                <button id="logout-btn" class="icon-btn" title="Logout" aria-label="Logout" style="display:none">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 2H3.5A1.5 1.5 0 0 0 2 3.5v9A1.5 1.5 0 0 0 3.5 14H6M10.5 11.5 14 8l-3.5-3.5M14 8H6"/></svg>
                </button>
            </div>
        </nav>
        <main id="content">
            <div id="app"></div>
        </main>
    </div>

    <div id="toast-container"></div>

    <script src="vendor/chart.min.js"></script>
    <script src="vendor/cytoscape.min.js"></script>
    <script src="vendor/dagre.min.js"></script>
    <script src="vendor/cytoscape-dagre.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components/login.js"></script>
    <script src="js/components/overview.js"></script>
    <script src="js/components/servers.js"></script>
    <script src="js/components/queues.js"></script>
    <script src="js/components/jobs.js"></script>
    <script src="js/components/workers.js"></script>
    <script src="js/components/failed.js"></script>
    <script src="js/components/scheduler.js"></script>
    <script src="js/components/dag.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
